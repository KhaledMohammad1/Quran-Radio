name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write update config (repo + build number)
        run: echo '{"repo":"${{ github.repository }}","build":${{ github.run_number }}}' > www/config.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk QuranRadio-1.${{ github.run_number }}.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QuranRadio-APK
          path: QuranRadio-1.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release (this is what the app checks for updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quran Radio 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: QuranRadio-1.${{ github.run_number }}.apk
          make_latest: true
