name: Build Android APK

# Pushes build and store an APK artifact.
# Manual runs publish the latest successful APK artifact without rebuilding it.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown to users in the update popup)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write update config (repo + build number)
        run: echo '{"repo":"${{ github.repository }}","build":${{ github.run_number }}}' > www/config.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk QuranRadio-1.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranRadio-APK
          path: QuranRadio-1.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Find latest successful build artifact
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: 'build-apk.yml', branch: 'main', status: 'success', per_page: 100 }
            );

            for (const run of runs) {
              if (String(run.id) === String(context.runId)) continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 }
              );
              const apkArtifact = artifacts.find(a => a.name === 'QuranRadio-APK' && !a.expired);
              if (apkArtifact) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('run_number', String(run.run_number));
                core.setOutput('head_sha', run.head_sha);
                core.info(`Using APK artifact from successful run #${run.run_number} (${run.id}).`);
                return;
              }
            }

            core.setFailed('No unexpired QuranRadio-APK artifact was found in any previous successful workflow run.');

      - name: Download existing APK (no build)
        uses: actions/download-artifact@v4
        with:
          name: QuranRadio-APK
          path: release-assets
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.source.outputs.run_number }}
          target_commitish: ${{ steps.source.outputs.head_sha }}
          name: Quran Radio 1.${{ steps.source.outputs.run_number }}
          body: ${{ inputs.notes }}
          files: release-assets/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
