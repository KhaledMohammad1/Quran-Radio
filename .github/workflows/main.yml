name: Build Quran Radio APK (Android 16)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip if uploaded directly from phone
        run: |
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found $ZIP_FILE, extracting..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure signing keystore exists
        run: |
          if [ ! -f "app/keystore.jks" ]; then
            keytool -genkeypair -v -keystore app/keystore.jks -alias quranradio -keyalg RSA -keysize 2048 -validity 10000 -storepass quranradio -keypass quranradio -dname "CN=Quran Radio, OU=Mobile, O=QuranRadio, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for easy download
        run: |
          cp app/build/outputs/apk/release/app-release.apk Quran-Radio-RedmiA3-Android16.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Radio-RedmiA3-Android16-APK
          path: Quran-Radio-RedmiA3-Android16.apk
